name: Publish

# Publishes the three packages when a release is published, with npm's
# provenance: a signed record of which commit and workflow built each one.
#
# Uses npm trusted publishing (OIDC), so no npm token is stored here. Each
# package needs this repository and workflow added as its trusted publisher on
# npmjs.com (package → Settings → Trusted publishing), which npm allows once
# the package exists. The first release was published by hand.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # In dependency order: each package depends on the one before it.
      - run: npm publish dist-packages/protocol --provenance --access public
      - run: npm publish dist-packages/js --provenance --access public
      - run: npm publish dist-packages/react --provenance --access public
