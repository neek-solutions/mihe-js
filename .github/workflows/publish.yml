name: Publish

# Publishes the three packages when a release is published, with npm's
# provenance: a signed record of which commit and workflow built each one.
#
# Uses npm trusted publishing (OIDC), so no npm token is stored here. Each
# package names this repository, this workflow and the `npm` environment as its
# trusted publisher on npmjs.com, with publishing allowed. The first release
# (0.1.0) was published by hand.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm accepts a publish only from this environment (the trusted
    # publisher names it), and the environment waits for a required
    # reviewer to approve the run. So a release cannot reach customers on
    # one person's GitHub access or a workflow change alone.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      # In dependency order: each package depends on the one before it. The
      # leading ./ matters: without it npm reads `dist-packages/js` as a
      # GitHub repository, user/repo, and tries to fetch it.
      - run: npm publish ./dist-packages/protocol --provenance --access public
      - run: npm publish ./dist-packages/js --provenance --access public
      - run: npm publish ./dist-packages/react --provenance --access public
